name: Deploy

# Manual deploy to the VPS. Trigger it from the Actions tab once the image
# has been published by the CI workflow and the VPS secrets are configured.
#
# To deploy automatically after every successful CI run on main, uncomment the
# workflow_run trigger below.
on:
  workflow_dispatch:
  # workflow_run:
  #   workflows: ["CI"]
  #   types: [completed]
  #   branches: [main]

jobs:
  deploy:
    name: Deploy to VPS over SSH
    runs-on: ubuntu-latest
    # Uncomment if using the workflow_run trigger, so failed CI runs don't deploy:
    # if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v6

      # Copy only the files the VPS needs to run the stack (the app/frontend
      # images come from ghcr, so src/ is not needed on the server). The repo
      # layout is preserved so the compose volume paths (./backend/*.yml) resolve.
      - name: Copy compose + monitoring config to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose.yml,backend/prometheus.yml,backend/promtail.yml"
          target: "~/easy-inventory"

      - name: Pull images and (re)start the stack
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GHCR_ACTOR,GHCR_TOKEN,GRAFANA_ADMIN_PASSWORD
          script: |
            set -e
            cd ~/easy-inventory
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            # --profile host-metrics includes node-exporter + promtail, which only
            # run on the Linux VPS (skipped locally on Docker Desktop).
            docker compose --profile host-metrics pull
            docker compose --profile host-metrics up -d
            docker image prune -f
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
