server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log

    # Capture the container id from the log file path.
    # NOTE: this yields the container *id*, not its name. For human-readable
    # container names, mount /var/run/docker.sock and switch to docker_sd_configs.
    relabel_configs:
      - source_labels: ["__path__"]
        regex: "/var/lib/docker/containers/([^/]+)/.*"
        target_label: container_id

    pipeline_stages:
      # 1) Docker wraps every line: {"log":"...","stream":"stdout","time":"..."}
      - json:
          expressions:
            output: log
            stream: stream
            time: time
      - timestamp:
          source: time
          format: RFC3339Nano

      # 2) The Spring Boot app logs JSON (logstash format) inside "log".
      #    Pull out the level; ignored gracefully for non-JSON lines.
      - json:
          expressions:
            level: level
          source: output

      - labels:
          stream:
          level:

      # 3) Ship the unwrapped application log line to Loki.
      - output:
          source: output
