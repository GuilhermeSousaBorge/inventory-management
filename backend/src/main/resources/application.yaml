spring:
  application:
    name: management
  datasource:
    url: jdbc:postgresql://localhost:5432/pizzaria
    username: admin
    password: admin
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: "dGhpcy1pcy1hLXZlcnktc2VjcmV0LWp3dC1rZXktZm9yLXBpenplcmlhLWFwcCEh"
  access-token-expiration-ms: 28800000
  refresh-token-expiration-days: 7

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Actuator / Prometheus metrics
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info, metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Structured (JSON) logging to stdout so Promtail/Loki can parse it.
# Native Spring Boot 4 feature — no logstash-logback-encoder dependency needed.
logging:
  structured:
    format:
      console: logstash
