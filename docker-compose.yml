name: easy-inventory
services:
  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pizzaria
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d pizzaria"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pizzaria.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backend (Spring Boot)
  # ---------------------------------------------------------------------------
  app:
    # In production the CI-built image is pulled from ghcr (`docker compose pull`).
    # Locally you can build it instead with `docker compose up --build` — Compose
    # tags the local build as this same image name.
    image: ghcr.io/guilhermesousaborge/inventory-management:latest
    build: ./backend
    container_name: easy-inventory-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pizzaria
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    image: ghcr.io/guilhermesousaborge/inventory-management-frontend:latest
    build: ./frontend
    container_name: easy-inventory-frontend
    ports:
      - "3000:3000"
    environment:
      # /api/* rewrites are proxied to the backend over the compose network.
      BACKEND_URL: http://app:8080
    depends_on:
      - app
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Availability — Uptime Kuma
  # ---------------------------------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Metrics — Prometheus + Node Exporter + Grafana
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    # Bound to localhost only — not exposed publicly (no built-in auth).
    # Reach it through Grafana or an SSH tunnel.
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./backend/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    # Collects host (VPS) metrics — requires Linux host mounts + pid:host, which
    # are unavailable on Docker Desktop. Enable with `--profile host-metrics`.
    profiles: ["host-metrics"]
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - "/:/host:ro,rslave"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3300:3000"
    environment:
      # Override via a .env file or shell env in production.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Logs — Loki + Promtail
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:latest
    container_name: loki
    # Bound to localhost only — queried by Grafana inside the compose network.
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    # Tails host (VPS) Docker container logs — Linux host paths unavailable on
    # Docker Desktop. Enable with `--profile host-metrics`.
    profiles: ["host-metrics"]
    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./backend/promtail.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  pgdata:
  pgadmin-data:
  uptime-kuma-data:
  prometheus-data:
  grafana-data:
  loki-data:
